<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNES 259 Anatomy Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height app — 3D specimen stage on the left, study panel on the right; stacks (stage then panel) on phones. */
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --ink:#162026; --muted:#56666D; --line:#D2DADD; --soft:#F3F6F7;
  --accent:#0D6B77; --accent-ink:#FFFFFF; --sel:#D98E1F; --ok:#2A8551; --bad:#BF3A2C;
  --c-muscle:#A3372E; --c-nerve:#9C7A00; --c-bone:#8C7A4E; --c-tendon:#5F6E73;
  --stage-a:#1E272C; --stage-b:#0B1013; --stage-ink:#E6EEF0; --stage-muted:#9FB0B6; --chip:rgba(14,20,23,.78);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1215; --panel:#131B1F; --ink:#E2EAED; --muted:#92A3AA; --line:#25333A; --soft:#182226;
  --accent:#4DB4C0; --accent-ink:#06252A; --sel:#F2B84B; --ok:#4CC27E; --bad:#FF6E60;
  --c-muscle:#E57A6F; --c-nerve:#EFCB45; --c-bone:#D8C9A2; --c-tendon:#A8B6BA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1215; --panel:#131B1F; --ink:#E2EAED; --muted:#92A3AA; --line:#25333A; --soft:#182226;
  --accent:#4DB4C0; --accent-ink:#06252A; --sel:#F2B84B; --ok:#4CC27E; --bad:#FF6E60;
  --c-muscle:#E57A6F; --c-nerve:#EFCB45; --c-bone:#D8C9A2; --c-tendon:#A8B6BA; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px}
@media (max-width:860px){.app{display:block;height:auto}}

/* Stage */
.app.cad .stage{background:radial-gradient(120% 90% at 50% 25%,#4A4A48,#1C1C1B)}
.stage{position:relative;min-width:0;background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b));overflow:hidden}
@media (max-width:860px){.stage{height:64vh;min-height:380px}}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}
.hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:10px max(12px,env(safe-area-inset-left,0px)) 0;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--stage-ink);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;padding:6px 10px;font:500 12.5px var(--f-body);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pill[aria-pressed="true"]{background:#E6EEF0;color:#0B1013}
.pill.ghost{cursor:default}
.seg{display:inline-flex;background:var(--chip);border:1px solid rgba(255,255,255,.1);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--stage-ink);font:500 12.5px var(--f-body);padding:6px 9px;cursor:pointer}
.seg button+button{border-left:1px solid rgba(255,255,255,.1)}
.seg button[aria-pressed="true"]{background:#E6EEF0;color:#0B1013}
.orient{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font:500 12px var(--f-mono);color:var(--stage-muted);
  background:var(--chip);padding:5px 9px;border-radius:6px;pointer-events:none;max-width:calc(100% - 24px)}
.tip{position:absolute;pointer-events:none;background:#F2F5F6;color:#0B1013;font:600 12.5px var(--f-body);padding:4px 8px;border-radius:6px;
  transform:translate(12px,-50%);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer}
.lb span{background:rgba(242,245,246,.92);color:#0B1013;font:600 11px var(--f-body);padding:2px 6px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.lb.nv span{background:#F3D34A}.lb.ar span{background:#F08A80}.lb.vn span{background:#9DB8F2}
.lb.on span{background:var(--sel);color:#1A1205}
.lb i{width:1px;height:var(--st,14px);background:rgba(242,245,246,.85)}
.lb b{width:5px;height:5px;border-radius:50%;background:#F2F5F6;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.drawer{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:52px;width:min(290px,calc(100% - 24px));background:rgba(14,20,23,.94);color:var(--stage-ink);
  border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:13px;z-index:5;max-height:calc(100% - 64px);overflow:auto}
.pill.exp{gap:8px;cursor:default}.pill.exp input{width:96px;accent-color:#E6EEF0}.pill.exp output{font:500 11.5px var(--f-mono);min-width:3.2em;color:var(--stage-muted)}
.drawer h3{margin:0;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted)}
.drawer label{display:flex;align-items:center;gap:8px;cursor:pointer}
.drawer .row{display:flex;flex-wrap:wrap;gap:6px}
.drawer input[type=range]{width:100%;accent-color:#E6EEF0}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--stage-ink);text-align:center;padding:24px;z-index:10;
  background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b))}
.loading h2{font:700 1.6rem var(--f-display);margin:0}
.loading .bar{width:min(320px,80%);height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
.loading .bar i{display:block;height:100%;width:0;background:#E6EEF0;transition:width .2s}
.loading p{margin:0;color:var(--stage-muted);font-size:13px;max-width:44ch}
.toast{position:absolute;left:50%;bottom:48px;transform:translateX(-50%);background:#F2F5F6;color:#0B1013;padding:8px 14px;border-radius:8px;font:600 13px var(--f-body);
  box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6;max-width:calc(100% - 32px);text-align:center}
.toast.ok{background:#4CC27E} .toast.bad{background:#FF8A7E}
.pinmark{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:4}
.pinmark i{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:3px solid #FFE600;box-shadow:0 0 0 2px rgba(0,0,0,.55),0 0 18px #FFE600;animation:pinp 1.2s ease-in-out infinite}
.pinmark span{position:absolute;left:26px;top:-34px;background:#FFE600;color:#111;font:700 11px var(--f-mono);letter-spacing:.08em;padding:2px 6px;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pinmark.off i{border-style:dashed}.pinmark.off span::after{content:' ↗ off screen'}
@keyframes pinp{50%{transform:scale(1.25);opacity:.7}}
@media (prefers-reduced-motion:reduce){.pinmark i{animation:none}}
.labbar{position:absolute;left:12px;right:12px;bottom:44px;background:rgba(14,20,23,.92);color:var(--stage-ink);border:1px solid rgba(255,255,255,.12);
  border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;z-index:4}
.labbar .t{font:600 15px var(--f-mono);color:#F3D34A;font-variant-numeric:tabular-nums}
@media (min-width:861px){.labbar{display:none}}

/* Panel */
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
@media (max-width:860px){.panel{border-left:0;border-top:1px solid var(--line)}}
.brand{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand .k{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font:700 1.45rem/1.15 var(--f-display);margin:2px 0 0;text-wrap:balance}
.brand h1 em{font-weight:500;color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:11px 6px;font:600 13.5px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{flex:1;overflow:auto;padding:16px 18px 28px;min-height:0}
@media (max-width:860px){.pane{overflow:visible}}
.kick{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.name{font:700 1.75rem/1.1 var(--f-display);margin:4px 0 2px;text-wrap:balance}
.sub{font:italic 500 1rem var(--f-display);color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chip{font:500 12px var(--f-body);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:2px 9px;background:transparent}
button.chip{cursor:pointer}
.chip.k-muscle{color:var(--c-muscle);border-color:currentColor}.chip.k-nerve{color:var(--c-nerve);border-color:currentColor}
.chip.k-bone,.chip.k-disc{color:var(--c-bone);border-color:currentColor}.chip.k-tendon{color:var(--c-tendon);border-color:currentColor}
dl.f{display:grid;grid-template-columns:6.8em minmax(0,1fr);gap:9px 12px;margin:0}
dl.f dt{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
dl.f dd{margin:0;min-width:0}
@media (max-width:400px){dl.f{grid-template-columns:1fr;gap:2px}dl.f dd{margin-bottom:8px}}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lnk{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:3px 8px;font:500 13px var(--f-body);cursor:pointer;color:var(--ink)}
.lnk.nv{border-color:var(--c-nerve)}
.note{margin-top:14px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--soft);border-radius:0 6px 6px 0;font-size:14px}
.note b{display:block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.btn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:8px 12px;font:600 13px var(--f-body);cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.hint{color:var(--muted);font-size:13px}
.howto{display:grid;gap:10px;margin:12px 0 16px}
.howto div{display:grid;grid-template-columns:5.5em 1fr;gap:10px;font-size:14px}
.howto b{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.unit{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left;background:transparent;cursor:pointer}
.unit strong{display:block;font:700 1.05rem var(--f-display)}
.unit span{font-size:12.5px;color:var(--muted)}
input.search{width:100%;font:15px var(--f-body);padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.filters button{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font:500 12px var(--f-body);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.letter{font:700 1.15rem var(--f-display);color:var(--accent);margin:12px 0 2px;position:sticky;top:-16px;background:var(--panel);padding:2px 0}
.it{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:7px 2px;cursor:pointer}
.it:hover{background:var(--soft)}
.it small{color:var(--muted);font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.modes{display:grid;gap:8px}
.mode{border:1px solid var(--line);border-radius:9px;padding:12px;text-align:left;background:transparent;cursor:pointer}
.mode strong{display:block;font:700 1.1rem var(--f-display)}
.mode span{color:var(--muted);font-size:13px}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.score{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 8px;font:500 12.5px var(--f-mono);color:var(--muted)}
.score b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.scen{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--soft)}
.scen .q{font:500 1.08rem/1.45 var(--f-display);margin:6px 0 0}
.timer{font:600 1.5rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.timer.low{color:var(--bad)}
.choices{display:grid;gap:7px;margin-top:10px}
.choice{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px}
.fb.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)} .fb.no{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.app.lecture{grid-template-columns:minmax(0,1fr) minmax(420px,46%)}
@media (max-width:860px){.app.lecture{display:flex;flex-direction:column}.app.lecture .panel{order:-1}.app.lecture .stage{height:56vh}}
.drop{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer}
.drop strong{font:700 1.05rem var(--f-display)} .drop span{color:var(--muted);font-size:13px}
.drop.over,.drop:hover{border-color:var(--accent);background:var(--soft)}
.slide{width:100%;max-width:100%;aspect-ratio:16/9;background:#FFFFFF;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.slide canvas{display:block}
.pp{height:100%;padding:5% 6%;color:#14191C;background:#FFFFFF;overflow:hidden;font:clamp(11px,1.5vw,15px)/1.45 var(--f-body)}
.pp h4{font:700 1.45em/1.2 var(--f-body);margin:0 0 .6em;color:#0D2B33} .pp ul{margin:0;padding-left:1.2em} .pp li{margin:.2em 0}
.pp img{float:right;max-width:42%;max-height:70%;margin:0 0 .5em 4%;object-fit:contain}
.snav{display:flex;align-items:center;gap:8px;margin:10px 0}
.snav .n{flex:1;text-align:center;font:500 13px var(--f-mono);color:var(--muted)}
.match{margin:10px 0 4px}
.chk{display:grid;gap:2px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.ci{display:flex;gap:8px;align-items:baseline;padding:4px 6px;border-radius:5px;font-size:13.5px}
.ci[role=button]{cursor:pointer}.ci[role=button]:hover{background:var(--soft)}
.ci b{width:1.1em;flex:none;text-align:center}.ci small{color:var(--muted)}
.ci.ok b{color:var(--ok)}.ci.parent b{color:var(--sel)}.ci.missing{color:var(--muted)}.ci.missing b{color:var(--muted)}
#lecFocus .search{flex:1;min-width:0}
.credit{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.45}
.credit a{color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}



/* ---- taskbar ---- */
.taskbar.hud{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;padding:7px 10px 8px;
  background:linear-gradient(180deg,rgba(9,14,17,.92),rgba(9,14,17,.78));border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto}
.taskbar .tg{display:flex;flex-direction:column;gap:3px;padding:3px 7px 4px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}
.taskbar .cap{font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--stage-muted);padding-left:2px;line-height:1.2}
.taskbar .tr{display:flex;align-items:center;gap:3px}
.taskbar .pill{background:transparent;border-color:transparent;padding:5px 8px;backdrop-filter:none;-webkit-backdrop-filter:none}
.taskbar .pill:hover:not(.exp){background:rgba(255,255,255,.09)}
.taskbar .pill[aria-pressed="true"],.taskbar .pill[aria-expanded="true"]{background:#E6EEF0;color:#0B1013}
.taskbar .seg{background:transparent;border-color:rgba(255,255,255,.1)}
.taskbar .pill.exp{padding:3px 6px}
.taskbar .spacer{flex:1}
.pill .chev{width:12px;height:12px;margin-left:-2px;opacity:.7;transition:transform .15s}
.pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pop{position:absolute;z-index:7;width:min(300px,calc(100% - 20px));max-height:calc(100% - 90px);overflow:auto;background:#0E1417;color:var(--stage-ink);
  border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:13px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.pop .pophd{display:flex;align-items:center;justify-content:space-between;margin:-2px -4px 0 0}
.pop h3{margin:0;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stage-muted)}
.pop .pophd h3{color:var(--stage-ink);font-size:11.5px}
.pop label{display:flex;align-items:center;gap:8px;cursor:pointer}
.pop .row{display:flex;flex-wrap:wrap;gap:6px}
.pop input[type=range]{width:100%;accent-color:#E6EEF0}
.popx{background:transparent;border:0;color:var(--stage-ink);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.popx:hover{background:rgba(255,255,255,.1)}
.popx svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
@media (max-width:1460px){.taskbar .cap{font-size:9px}}
@media (max-width:860px){.taskbar.hud{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:6px 8px}.taskbar::-webkit-scrollbar{display:none}.taskbar>*{flex:none}.taskbar .cap{display:none}.taskbar .tg{padding:2px 4px}}

/* ---- macOS-style menu bar ---- */
.mbar.hud{position:absolute;left:50%;right:auto;top:12px;transform:translateX(-50%);z-index:4;display:flex;flex-wrap:nowrap;align-items:center;gap:2px;padding:4px;
  background:rgba(32,34,38,.62);border:.5px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 .5px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;overflow:visible}
.mb{display:flex;align-items:center;gap:6px;background:transparent;border:0;color:#F2F4F5;font:500 13px/1 inherit;font-family:inherit;padding:8px 13px;border-radius:10px;cursor:pointer;transition:background .12s}
.mb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mb .chev{width:11px;height:11px;opacity:.6;stroke-width:2.4;transition:transform .18s}
.mb:hover{background:rgba(255,255,255,.1)}.mb[aria-expanded="true"]{background:rgba(255,255,255,.18)}
.mb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.mb:focus-visible,.mi:focus-visible{outline:2px solid #0A84FF;outline-offset:1px}
.pop.menu{position:absolute;z-index:30;width:252px;max-height:calc(100% - 80px);overflow:auto;padding:5px;gap:0;display:block;

/* layer dissection: find what is visible from outside, peel it, repeat */
const disCam=new THREE.PerspectiveCamera(30,.8,5,20000);
function computeLayers(reg){
  const R=REGIONS[reg][1];const inR=st=>!R||R.includes(st.region);
  const musc=ALL.filter(st=>(st.kind==='muscle'||st.kind==='tendon')&&inR(st));const mset=new Set(musc.map(s=>s.id));
  const all=ALL.flatMap(st=>st.meshes);const vis0=all.map(m=>m.visible);const op0=ST.opacity;ST.opacity=1;
  for(const st of ALL)for(const m of st.meshes){const mt=m.material;if(mt.opacity<1){mt.opacity=1;mt.transparent=false}}
  const limb=reg==='upper'||reg==='lower';const groups=limb?[musc.filter(s=>s.side==='R'),musc.filter(s=>s.side==='L'),musc.filter(s=>!s.side)].filter(g=>g.length):[musc];
  const dirs=[];for(let a=0;a<8;a++){const t=a/8*Math.PI*2;dirs.push(new THREE.Vector3(Math.cos(t),Math.sin(t),0))}dirs.push(new THREE.Vector3(0,-.4,1).normalize(),new THREE.Vector3(0,.4,-1).normalize());
  const layerOfId=new Map();
  for(const grp of groups){
    const bb=new THREE.Box3();for(const st of grp)bb.union(st.box);const c=dataToWorld(bb.getCenter(new THREE.Vector3()));const r=bb.getSize(new THREE.Vector3()).length()/2;
    const dist=r/Math.tan(15*Math.PI/180)*1.05;const pxmm=160/(2*dist*Math.tan(15*Math.PI/180));
    const rem=new Set(grp.map(s=>s.id));
    const setCam=d=>{const w=dirToWorld(d);disCam.position.copy(c).addScaledVector(w,dist);disCam.up.copy(dirToWorld(Math.abs(d.z)>.8?new THREE.Vector3(0,1,0):new THREE.Vector3(0,0,1)));disCam.lookAt(c);disCam.updateMatrixWorld();disCam.updateProjectionMatrix()};
    const shot=()=>{const px=idPass(128,160,disCam);const cnt=new Map();for(let i=0;i<px.length;i+=4){const id=px[i]<<16|px[i+1]<<8|px[i+2];if(id)cnt.set(id,(cnt.get(id)||0)+1)}return cnt};
    const hideAll=()=>{for(const st of ALL){for(const m of st.meshes)m.visible=false;if(st.ghosts)for(const g of st.ghosts)g.visible=false}};
    // each muscle's own silhouette from every side, then how much of it is still uncovered in each round
    const solo=new Map();for(const st of grp){hideAll();for(const m of st.meshes)m.visible=true;solo.set(st.id,dirs.map(d=>{setCam(d);return shot().get(st.idx)||0}))}
    for(let L=0;L<5&&rem.size;L++){
      hideAll();for(const st of ALL)if(rem.has(st.id)||!mset.has(st.id)&&(st.kind==='bone'||st.kind==='muscle'||st.kind==='tendon'))for(const m of st.meshes)m.visible=true;
      const per=dirs.map(d=>{setCam(d);return shot()});
      const lay=[...rem].filter(id=>{const st=S[id],so=solo.get(id);return dirs.some((d,i)=>{const n=per[i].get(st.idx)||0;return n>=8&&n>=so[i]*.45})});
      if(!lay.length||L===4){for(const id of rem)layerOfId.set(id,L);break}
      for(const id of lay){layerOfId.set(id,L);rem.delete(id)}
    }
  }
  const layers=[];for(const [id,L] of layerOfId)(layers[L]=layers[L]||[]).push(id);
  for(let i=layers.length-1;i>=0;i--)if(!layers[i])layers.splice(i,1);
  all.forEach((m,i)=>m.visible=vis0[i]);ST.opacity=op0;applyVis();
  return layers;
}
const LAYN=['Superficial muscles','Second layer','Third layer','Deep muscles','Deepest muscles'];
function disSteps(){const s=DIS.layers.map((l,i)=>({t:LAYN[Math.min(i,4)],ids:l,i}));s.push({t:'Nerves & vessels',nv:true});s.push({t:'Skeleton',bone:true});return s}
function disApply(){
  const steps=disSteps(),cur=steps[DIS.step];ST.hidden.clear();isolate=null;ST.region=DIS.reg;ST.side='both';ST.opacity=1;ST.fade=false;
  for(let i=0;i<DIS.step&&i<DIS.layers.length;i++)for(const id of DIS.layers[i])ST.hidden.add(id);
  ST.ly={bone:true,muscle:!cur.nv&&!cur.bone,tendon:!cur.nv&&!cur.bone,ligament:!!(cur.nv||cur.bone),nerve:!!cur.nv,vessel:!!cur.nv};ST.xray=false;ST.labels=true;$('#bLabels').setAttribute('aria-pressed',true);
  applyVis();syncDrawer();

function startDis(reg){if(lab.active)labStop();QZ.active=false;TOUR.active=false;DIS.reg=reg;DIS.step=0;DIS.tap=null;ST.sel=null;setExplode(0);if(ST.pose!=='stand')setPose('stand');ST.look='atlas';applyLook();

/* tours: follow a nerve or vessel from start to finish */
function tourData(id){return NERV.find(n=>n.id===id)||VESS.find(n=>n.id===id)}
function resample(path,step){const P=path.map(q=>new THREE.Vector3(q[0],q[1],q[2]));if(P.length<2)return P;const c=new THREE.CatmullRomCurve3(P,false,'centripetal');const n=Math.max(2,Math.round(c.getLength()/step));return c.getSpacedPoints(n)}
function startTour(id){
  if(lab.active)labStop();QZ.active=false;DIS.active=false;
  const st=S[id],n=tourData(id);if(!n)return;const path=n.paths.reduce((a,b)=>b.length>a.length?b:a);const pts=resample(path,6);
  const near=c=>{let bi=0,bd=1e18;pts.forEach((p,i)=>{const d=p.distanceToSquared(c);if(d<bd){bd=d;bi=i}});return [bi,Math.sqrt(bd)]};
  const stops=[{i:0,t:'Start',txt:st.kind==='nerve'?(C.NER[st.k]?'Roots: '+C.NER[st.k][0]:'Origin'):(C.VES[st.k]?'Begins: '+C.VES[st.k][0]:'Origin')}];
  if(st.kind==='nerve'){for(const mk of (SUPPLIES[st.k]||[])){const mid=sameSide(mk,st.side);if(!mid)continue;const m=S[mid];const [i,d]=near(m.center);if(d<120)stops.push({i,t:m.name,txt:'Supplies the '+m.name.toLowerCase()+(C.MUS[mk]?' — '+C.MUS[mk][2].charAt(0).toLowerCase()+C.MUS[mk][2].slice(1):''),m:mid})}}
  else{const own=new Set(n.paths.flat().map(String));
    for(const o of VESS){if(o.id===id||o.side&&o.side!==st.side||o.kind!==st.kind)continue;const p0=o.paths[0][0],p1=o.paths[0][o.paths[0].length-1];
      for(const [q,lab2] of [[p0,'branch'],[p1,'joins']]){const [i,d]=near(new THREE.Vector3(...q));if(d<14&&i>0){stops.push({i,t:o.name,txt:(st.kind==='artery'?(i>=pts.length-2?'Continues as the ':'Gives off the '):(i>=pts.length-2?'Drains into / continues as the ':'Receives the '))+o.name.toLowerCase(),m:o.id});break}}}}
  stops.push({i:pts.length-1,t:'End',txt:st.kind==='nerve'?(C.NER[st.k]?C.NER[st.k][3]:'Termination'):(C.VES[st.k]?'Ends: '+C.VES[st.k][1]:'Termination')});
  stops.sort((a,b)=>a.i-b.i);const seen=new Set();TOUR.stops=stops.filter(s=>{const key=s.t;if(seen.has(key))return false;seen.add(key);return true});
  Object.assign(TOUR,{active:true,id,pts,si:0,ans:null,tap:null});
  ST.hidden.clear();isolate=null;ST.region='all';ST.side='both';ST.ly={bone:true,muscle:true,tendon:true,ligament:true,nerve:st.kind==='nerve',vessel:st.kind!=='nerve'};ST.xray=true;ST.opacity=.35;ST.sel=id;ST.labels=false;$('#bLabels').setAttribute('aria-pressed',false);
  setExplode(0);if(ST.pose!=='stand')setPose('stand');applyLook();syncDrawer();
  tourGo(0,true);
}
function tourGo(si,jump){
  const a=TOUR.stops[TOUR.si],b=TOUR.stops[si];TOUR.si=si;TOUR.ans=null;TOUR.opts=null;renderStudy();
  const off=camera.position.clone().sub(controls.target);const L=Math.min(320,Math.max(220,off.length()));off.setLength(L);
  const from=jump?b.i:a.i,to=b.i;const dir=to>=from?1:-1;const idxs=[];for(let i=from;dir>0?i<=to:i>=to;i+=dir)idxs.push(i);
  const wp=idxs.map(i=>dataToWorld(TOUR.pts[i]));const t0=performance.now(),dur=jump?650:Math.min(4200,Math.max(700,wp.length*45));
  const p0=camera.position.clone(),c0=controls.target.clone();
  anim=now=>{let k=Math.min(1,(now-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(jump){controls.target.lerpVectors(c0,wp[0],e);camera.position.lerpVectors(p0,wp[0].clone().add(off),e)}
    else{const f=e*(wp.length-1),i=Math.floor(f),u=f-i;const p=wp[i].clone().lerp(wp[Math.min(wp.length-1,i+1)],u);controls.target.copy(p);camera.position.copy(p).add(off)}
    if(k>=1){anim=null;tourArrive()}};
}
function tourArrive(){const s=TOUR.stops[TOUR.si];if(s.m&&S[s.m]){if(TOUR.quiz&&S[s.m].kind==='muscle'){const pool=Object.keys(C.MUS).filter(k=>byK[k]&&k!==S[s.m].k&&regOfK(k)===regOfK(S[s.m].k));TOUR.opts=shuffle([S[s.m].k,...pick(pool,3)])}

const HD={loaded:false,loading:false,armed:0};
async function loadHD(){
  if(HD.loaded||HD.loading)return;HD.loading=true;const b=$('#bHD');
  try{
    const meta=await fetchJSON('hd.json');let done0=0;const parts=[];
    for(const p of meta.parts){const part=await fetchData(p,got=>{b.textContent='HD '+Math.round((done0+got)/meta.bytes*90)+'%'});done0+=part.length;parts.push(part)}
    b.textContent='HD …';await new Promise(r=>setTimeout(r,20));
    const all=new Uint8Array(done0);{let o=0;for(const q of parts){all.set(q,o);o+=q.length}}
    let u8=await b64(all);
    const buf=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();u8=null;
    const p16=new Uint16Array(buf,0,meta.nv*3),io0=meta.posBytes+(meta.posBytes%4?2:0),i16=new Uint16Array(buf,io0,meta.ni),ax8=new Uint8Array(buf,meta.auxOff,meta.nv*2);

      for(let i=0;i<vc*3;i+=3){const q=vo*3+i;p[i]=p16[q]*K[0]+L[0];p[i+1]=p16[q+1]*K[1]+L[1];p[i+2]=p16[q+2]*K[2]+L[2]}
      const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setIndex(new THREE.BufferAttribute(i16.slice(io,io+ic),1));
      g.setAttribute('aux',new THREE.BufferAttribute(ax8.slice(vo*2,(vo+vc)*2),2,true));g.computeVertexNormals();g.computeBoundingSphere();g.computeBoundingBox();
      const mesh=REAL[mi],old=mesh.geometry;mesh.geometry=g;if(mesh.userData.ghost)mesh.userData.ghost.geometry=g;old.dispose();
      if(mi%40===0){b.textContent='HD '+(90+Math.round(mi/REAL.length*10))+'%';await new Promise(r=>setTimeout(r,0))}
    }
    HD.loaded=true;b.textContent='HD';b.setAttribute('aria-pressed',true);LS.set('kl.hd',1);
    Q.hd=true;Q.cur=0;
    renderer.shadowMap.needsUpdate=true;key.shadow.mapSize.set(4096,4096);if(key.shadow.map){key.shadow.map.dispose();key.shadow.map=null}

  HD.loading=false;
}

let shaderChecked=0;
function shaderFallback(){

  if(!bad)return;

/* adaptive quality: drop resolution while the view is moving (more if frames are slow), restore full sharpness when it stops;
   idle frames are throttled so the GPU is free the moment you grab the model again */
function fullPR(){const d=window.devicePixelRatio||1;if(Q.capPR)return Math.min(d,Q.capPR);return Q.hd?Math.min(3,d*(window.innerWidth>860?1.6:1.25)):Math.min(d,2)}

function loop(now){if(shaderChecked<3&&++shaderChecked===3)shaderFallback();requestAnimationFrame(loop);
  const dt=Q.prev?now-Q.prev:16;Q.prev=now;
  if(anim)anim(now);controls.update();
  Q.moving=!!anim||now-Q.lastMove<160;
  if(Q.moving){if(dt<200)Q.ema=Q.ema*.85+dt*.15;
    if(Q.ema>30)Q.f=Math.max(.6,Q.f*.95);else if(Q.ema<20)Q.f=Math.min(1,Q.f*1.02);
    const F=fullPR();setPR(Math.max(Math.min(F,.9),F*Q.f));Q.idleSince=now;Q.dirty=true}
  else if(Q.cur!==Math.round(fullPR()*20)/20&&now-Q.idleSince>100){setPR(fullPR());Q.dirty=true}
  updateOrient();updatePinMark();
  if(Q.moving||Q.dirty||now-Q.lastDraw>66){renderer.render(scene,camera);Q.lastDraw=now;Q.dirty=false}
  updateLabels()}

    if(!q)sc=ST.studied.has(st.k)?2:0;else if(n.startsWith(q))sc=5;else if((' '+n).includes(' '+q))sc=4;else if(n.includes(q))sc=3;
    else{const w=q.split(' ');if(w.every(x=>n.includes(x)))sc=2;else continue}
    if(q&&!sc)continue;out.push({st,sc:sc-n.length/400})}

function aiErr(e){const c=e&&e.code;

/* tiny safe markdown: paragraphs, bullets, bold */
function md(t){const out=[];let list=null;for(const raw of String(t).split('\n')){const l=raw.trimEnd();const b=l.match(/^\s*[-*•]\s+(.*)/)||l.match(/^\s*\d+[.)]\s+(.*)/);
  const fmt=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\W)\*(?!\s)(.+?)\*(?=\W|$)/g,'$1<em>$2</em>').replace(/^#{1,4}\s*/,'');
  if(b){if(!list){list=[];out.push(list)}list.push('<li>'+fmt(b[1])+'</li>')}else{list=null;if(l.trim())out.push('<p>'+fmt(l)+'</p>')}}
  return out.map(x=>Array.isArray(x)?'<ul>'+x.join('')+'</ul>':x).join('')}
/* facts the app already holds about a structure, so Claude works from the course notes */
function factsFor(k){const st=byK[k]&&byK[k][0];if(!st)return '';const L=[`${st.name} (${KINDW[st.kind]||st.kind}, ${st.region})`];
  const m=C.MUS[k];if(m)L.push(`Origin: ${m[0]}. Insertion: ${m[1]}. Action: ${m[2]}. Innervation: ${m[3]}. Note: ${m[5]||''}`);
  const n=C.NER[k];if(n){L.push(`Roots: ${n[0]}. Course: ${n[1]}. Motor: ${n[2]}. Clinical: ${n[3]}`);const sup=(SUPPLIES[k]||[]).filter(x=>byK[x]).map(nameOfK);if(sup.length)L.push('Supplies: '+sup.join(', '))}
  const v=C.VES[k];if(v)L.push(`Begins: ${v[0]}. Ends: ${v[1]}. Supplies/drains: ${v[2]}. Clinical: ${v[3]}`);
  const g=LIG[k];if(g)L.push(`Joint: ${g[0]}. Attaches: ${g[1]}. Function: ${g[2]}. ${g[3]}`);
  if(C.BON[k])L.push(C.BON[k].join(' '));if(C.TEN[k])L.push(C.TEN[k].join(' '));if(MN[k])L.push('Mnemonic: '+MN[k]);
  if(DEFS&&DEFS[k])L.push('Reference: '+firstSentences(DEFS[k][0],3,500));return L.join('\n')}
function resolveName(nm){nm=String(nm||'').trim();if(!nm)return null;const low=nm.toLowerCase().replace(/^(the\s+)?(left|right)\s+/,'');
  const side=/\bleft\b/i.test(nm)?'L':/\bright\b/i.test(nm)?'R':'R';
  let st=ALL.find(s=>s.name.toLowerCase()===low)||ALL.find(s=>s.name.toLowerCase().replace(/ (muscle|nerve|artery|vein|ligament)$/,'')===low.replace(/ (muscle|nerve|artery|vein|ligament)$/,''));
  if(!st){try{const k=[...analyze(nm).keys][0];if(k&&byK[k])st=byK[k][0]}catch(e){}}
  if(!st){const it=palItems(low)[0];st=it&&it.st}
  if(!st)return null;return S[sameSide(st.k,side)]||st}
/* Explore: "Explain with AI" */

  const prompt=`You are an anatomy tutor for a university kinesiology course (KNES 259, Human Anatomy & Physiology I). Explain the structure below to a student preparing for a cadaver lab practical.
Use the course facts given; do not contradict them. Write at most 170 words in short Markdown: one sentence on what it is, then bullets for

FACTS:\n${factsFor(st.k)}`;
  AI.sample(prompt,{onText:({text})=>{out.innerHTML=md(text)},cache:{gcTime:6*3600e3}}).catch(e=>{out.innerHTML=`<p class="hint">${esc(e.text?'':aiErr(e))}</p>`+(e.text?md(e.text):'')})}
/* Study: explain an answer */
function aiWhy(q){const box=$('#aiWhy');if(!box||!aiOK())return;box.hidden=false;const out=box.querySelector('.aitext');out.innerHTML='<p class="hint">Thinking…</p>';
  const picked=q.opts&&q.pick!=null?q.opts[q.pick].t:(q.last?q.last.name:'');

Correct answer: ${nameOfK(q.k)}${q.opts?' — '+(q.opts.find(o=>o.ok)||{}).t:''}
${picked&&!q.ok?'Student answered: '+picked:''}
Facts:\n${factsFor(q.k)}`;
  AI.sample(prompt,{onText:({text})=>{out.innerHTML=md(text)},cache:{gcTime:3600e3}}).catch(e=>{out.innerHTML=`<p class="hint">${esc(aiErr(e))}</p>`})}
/* Study: AI clinical cases → tap the answer on the model */
async function aiCases(btn){if(!aiOK())return;const pool=poolKeys(SCFG.reg,null).filter(k=>['muscle','nerve','vessel','ligament'].includes(kindOfK(k)));
  if(pool.length<4){toast('Pick a larger region first');return}
  const list=shuffle(pool).slice(0,60);btn.disabled=true;const old=btn.innerHTML;btn.innerHTML='<strong>Writing cases…</strong><span>Claude is writing five clinical scenarios for you.</span>';
  try{const r=await AI.sample.json(`Write 5 short clinical bellringer cases for a kinesiology anatomy cadaver lab. Each case describes a patient (mechanism of injury, signs, what they cannot do) whose problem points to ONE structure from the list, and ends with a question like "Find the injured muscle." Do not name the structure. Vary the structures.

LIST (key: name — facts):\n`+list.map(k=>`${k}: ${nameOfK(k)} — ${factsFor(k).split('\n').slice(1,2).join(' ').slice(0,160)}`).join('\n'),{cache:false});

    startQuiz('find',items.map(x=>{const q=mkQ(x.key,'find',{});q.prompt=String(x.case);q.short='Find the structure in the case';q.aiWhy=String(x.why||'');q.hint=String(x.hint||'');return {k:x.key,q}}),{title:'AI clinical cases'})}
  catch(e){const m=aiErr(e);if(m)toast(m,'bad')}finally{btn.disabled=false;btn.innerHTML=old}}
/* Lecture: read the slide picture with Claude */

  const inp=$('#chatIn');inp.oninput=()=>{inp.style.height='auto';inp.style.height=Math.min(140,inp.scrollHeight)+'px'};
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTutor(inp.value)}};
  $('#chatGo').onclick=()=>{if(AI.busy){AI.ctl&&AI.ctl.abort()}else sendTutor(inp.value)};
  pane.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>sendTutor(b.dataset.sg));
  const c=$('#chatClear');if(c)c.onclick=()=>{AI.chat=[];LS.set('kl.chat',[]);renderTutor()};
  pane.scrollTop=pane.scrollHeight}
async function sendTutor(text){text=String(text||'').trim();if(!text||AI.busy||!aiOK())return;
  AI.chat.push({role:'user',content:text});AI.busy=true;renderTutor();
  const chat=$('#chat');const bub=document.createElement('div');bub.className='msg a';bub.innerHTML='<p class="hint">Thinking…</p>';chat.appendChild(bub);pane.scrollTop=pane.scrollHeight;
  const tools=AI.limits&&AI.limits.tools?TUTOR_TOOLS().map(t=>({...t,execute:(a)=>{const r=t.execute(a||{});const n=document.createElement('div');n.className='tool';n.textContent=t.name==='show_on_model'?'↳ showing on the model':'↳ reading course notes';bub.appendChild(n);return r}})):undefined;
  AI.ctl=new AbortController();const turns=AI.chat.slice(-12);
  try{const {text:ans}=await AI.sample([{role:'user',content:TUTOR_RULES()},...turns],{cache:false,signal:AI.ctl.signal,tools,onText:({text})=>{bub.innerHTML=md(text);pane.scrollTop=pane.scrollHeight}});
    AI.chat.push({role:'assistant',content:ans})}
  catch(e){const m=aiErr(e);if(e.text)AI.chat.push({role:'assistant',content:e.text+(m?'\n\n_'+m+'_':'')});else if(m)AI.chat.push({role:'assistant',content:'_'+m+'_'});if(!AI.chat.length||AI.chat[AI.chat.length-1].role==='user')AI.chat.pop()}
  finally{AI.busy=false;AI.chat=AI.chat.slice(-30);LS.set('kl.chat',AI.chat);if(ST.tab==='A')renderTutor()}}

/* ---------- graphics quality ---------- */
const QUAL={mode:new URLSearchParams(location.search).get('lite')?'low':LS.get('kl.quality','auto'),low:false};
function liteMat(m){const L=new THREE.MeshStandardMaterial({color:m.color.clone(),roughness:m.roughness,metalness:0,side:m.side,transparent:m.transparent,opacity:m.opacity,depthWrite:m.depthWrite});L.userData=m.userData;return L}
function setQuality(low){
  if(low===QUAL.low)return;QUAL.low=low;
  for(const st of ALL)for(const m of st.meshes){if(low){m.userData.hiMat=m.userData.hiMat||m.material;m.material=liteMat(m.userData.hiMat)}else if(m.userData.hiMat){m.material=m.userData.hiMat}}
  renderer.shadowMap.enabled=!low;Q.capPR=low?1:0;Q.cur=0;applyLook();renderQual()}
function renderQual(){const r=$('#qRow');if(!r)return;r.innerHTML=[['auto','Auto'],['high','High'],['low','Low (faster)']].map(([k,t])=>`<button class="pill" data-q="${k}" aria-pressed="${QUAL.mode===k}">${t}</button>`).join('');
  r.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{QUAL.mode=b.dataset.q;LS.set('kl.quality',QUAL.mode);setQuality(QUAL.mode==='low');renderQual()});
  $('#qNote').textContent=QUAL.low?'Low: simple shading, no shadows — smoother on laptops and phones.':'High: full tissue shading and shadows.'+(QUAL.mode==='auto'?' Auto switches to Low if movement gets slow.':'')}
setPose('stand');applyLook();resize();
if(QUAL.mode==='low')setQuality(true);renderQual();
/* auto: if the first few seconds of movement run below ~24 fps, switch to low quality once */
setInterval(()=>{if(QUAL.mode!=='auto'||QUAL.low||!Q.moving)return;if(Q.ema>42&&Q.f<=.62){setQuality(true);toast('Switched to Low graphics for smoother movement — change it under Layers')}},1500);
const {c:bc,r:br}=bodyCenterWorld();camera.position.set(bc.x,bc.y,bc.z+br/Math.tan(camera.fov*Math.PI/360)*.95);controls.target.copy(bc);
requestAnimationFrame(loop);
clearInterval(tipT);$('#loading').hidden=true;

renderPane();queueLabels();
})();
</script>
